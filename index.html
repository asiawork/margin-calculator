<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="คิดกำไร">
<meta name="application-name" content="คิดกำไร">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>ร้านรองเท้าแม่คุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1d5fa8;
    --blue-dark: #164a84;
    --blue-soft: #e5effa;
    --sky: #f2f7fd;
    --red: #c0392b;
    --red-soft: #fdecea;
    --ink: #17202b;
    --muted: #5b6878;
    --line: #c9d6e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Sarabun", system-ui, sans-serif;
    color: var(--ink);
    background: var(--sky);
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vh, 14px);
    padding: calc(env(safe-area-inset-top) + clamp(10px, 2vh, 18px)) 16px calc(env(safe-area-inset-bottom) + 14px);
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(22px, 3.4vh, 28px);
    font-weight: 700;
    color: var(--blue-dark);
  }

  .panel { flex: 1; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }

  .field { display: block; }
  .field-name {
    display: block;
    font-weight: 700;
    font-size: clamp(21px, 3vh, 24px);
    margin-bottom: 4px;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    border: 3px solid var(--line);
    border-radius: 16px;
    background: #fff;
    padding: 0 16px;
  }
  .input-wrap:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(29, 95, 168, .15);
  }
  .input-wrap input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: clamp(32px, 5vh, 42px);
    font-weight: 700;
    border: 0;
    outline: 0;
    padding: clamp(4px, 0.8vh, 8px) 0;
    background: transparent;
    color: var(--ink);
  }
  .input-wrap input::placeholder { color: #bccada; font-weight: 400; }
  .unit {
    font-size: clamp(22px, 3vh, 26px);
    font-weight: 600;
    color: var(--muted);
    margin-left: 10px;
  }

  .result {
    flex: 1;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-radius: 20px;
    padding: 10px 16px;
    text-align: center;
    background: #fff;
    border: 3px dashed var(--line);
    color: var(--muted);
  }
  .result.good { background: var(--blue-soft); border: 3px solid var(--blue); color: var(--blue-dark); }
  .result.bad { background: var(--red-soft); border: 3px solid var(--red); color: var(--red); }
  .result-label {
    font-size: clamp(22px, 3.2vh, 26px);
    font-weight: 700;
  }
  .result-value {
    font-size: clamp(48px, 8.5vh, 68px);
    font-weight: 700;
    line-height: 1.1;
    word-break: break-word;
  }
  .result-value small {
    font-size: .55em;
    font-weight: 700;
  }
  .result-sub {
    font-size: clamp(20px, 2.9vh, 24px);
    color: var(--ink);
    min-height: 1.3em;
  }

  .clear {
    display: block;
    width: 100%;
    font: inherit;
    font-size: clamp(22px, 3vh, 24px);
    font-weight: 700;
    padding: clamp(8px, 1.4vh, 12px);
    border-radius: 16px;
    border: 3px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .clear:active { background: var(--blue-soft); }
</style>
</head>
<body>
<main>
  <h1>ร้านรองเท้าแม่คุณ</h1>

  <!-- รู้ราคาทุนกับราคาขาย หากำไรเป็น % -->
  <section class="panel">
    <label class="field">
      <span class="field-name">ราคาทุน</span>
      <span class="input-wrap">
        <input id="p-cost" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0">
        <span class="unit">บาท</span>
      </span>
    </label>
    <label class="field">
      <span class="field-name">ราคาขาย</span>
      <span class="input-wrap">
        <input id="p-sell" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0">
        <span class="unit">บาท</span>
      </span>
    </label>

    <div class="result" id="p-result" aria-live="polite">
      <div class="result-label" id="p-label">กำไร</div>
      <div class="result-value" id="p-value">–</div>
      <div class="result-sub" id="p-sub"></div>
    </div>

    <button class="clear" data-clear="p-cost p-sell">เริ่มใหม่</button>
  </section>

</main>

<script>
(function () {
  function $(id) { return document.getElementById(id); }

  function num(el) {
    var s = el.value.replace(/,/g, '').trim();
    if (s === '' || s === '.') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }

  function fmt(n) {
    var r = Math.round(n * 100) / 100;
    return r.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function fmtPct(n) {
    return (Math.round(n * 10) / 10).toLocaleString('th-TH', { maximumFractionDigits: 1 });
  }

  // รับเฉพาะตัวเลข ลูกน้ำ และจุดทศนิยมจุดเดียว
  function sanitize(el) {
    var v = el.value.replace(/[^\d.,]/g, '');
    var firstDot = v.indexOf('.');
    if (firstDot !== -1) {
      v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
    }
    if (v !== el.value) el.value = v;
  }

  function setResult(box, state) {
    box.classList.remove('good', 'bad');
    if (state) box.classList.add(state);
  }

  /* ---------- หากำไร ---------- */
  function calcProfit() {
    var cost = num($('p-cost'));
    var sell = num($('p-sell'));
    var box = $('p-result');

    if (sell === null || cost === null) {
      $('p-label').textContent = 'กำไร';
      $('p-value').textContent = '–';
      $('p-sub').textContent = '';
      setResult(box, null);
      return;
    }

    var profit = sell - cost;
    var loss = profit < 0;
    $('p-label').textContent = loss ? 'ขาดทุน' : 'กำไร';

    if (cost > 0) {
      $('p-value').innerHTML = fmtPct(Math.abs(profit) / cost * 100) + '<small>%</small>';
      $('p-sub').textContent = 'เป็นเงิน ' + fmt(Math.abs(profit)) + ' บาท';
    } else {
      $('p-value').innerHTML = fmt(Math.abs(profit)) + ' <small>บาท</small>';
      $('p-sub').textContent = '';
    }
    setResult(box, loss ? 'bad' : 'good');
  }

  /* ---------- ช่องกรอก ---------- */
  var pairs = [['p-cost', 'p-sell', calcProfit]];
  pairs.forEach(function (pair) {
    var first = $(pair[0]), second = $(pair[1]), calc = pair[2];
    [first, second].forEach(function (el) {
      el.addEventListener('input', function () { sanitize(el); calc(); });
      // แตะช่องที่มีตัวเลขอยู่แล้ว เลือกทั้งหมดไว้ให้พิมพ์ทับได้เลย
      el.addEventListener('focus', function () {
        setTimeout(function () { try { el.setSelectionRange(0, el.value.length); } catch (e) {} }, 0);
      });
    });
    first.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); second.focus(); }
    });
    second.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); second.blur(); }
    });
  });

  // แตะที่ว่างเพื่อเก็บแป้นพิมพ์
  document.addEventListener('touchstart', function (e) {
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT' && !e.target.closest('.input-wrap')) a.blur();
  }, { passive: true });

  document.querySelectorAll('[data-clear]').forEach(function (b) {
    b.addEventListener('click', function () {
      b.dataset.clear.split(' ').forEach(function (id) { $(id).value = ''; });
      calcProfit();
    });
  });

})();
</script>
</body>
</html>
